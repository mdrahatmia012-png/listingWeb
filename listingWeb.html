<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <title>To_do_list</title>
</head>
<body>

    <h1>Note Book</h1>
    <input id="input" placeholder="Type the list name here "><button id="ad">add</button>
    <div id="di"><ol id="l"></ol></div>

    <script>
        const input = document.getElementById("input");
        const btn = document.getElementById("ad");
        const div = document.getElementById("di");
        const li = document.getElementById("l");
        let savedNote = JSON.parse(localStorage.getItem("mynote")) || [];

        const saveList = () => {
            localStorage.setItem("mynote", JSON.stringify(savedNote));
        };

        const createNoteDOM = (textValue) => {
            const newli = document.createElement("li");
            newli.innerText = textValue + " ";
            const cre = document.createElement("button");
            cre.classList.add("t");
            cre.innerText = "Delete";
            newli.appendChild(cre);
            li.appendChild(newli);
            
            cre.addEventListener("click", () => {
                savedNote = savedNote.filter(item => item !== textValue);
                saveList();
                newli.remove();
            });
        };

        const fn = () => {
            const textValue = input.value.trim();
            if (textValue) {
                savedNote.push(textValue);
                saveList();
                createNoteDOM(textValue);
                input.value = "";
            }
        };

        btn.addEventListener("click", fn);
        input.addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                fn();
            }
        });

        savedNote.forEach(note => {
            createNoteDOM(note);
        });

    </script>
</body>
</html>
